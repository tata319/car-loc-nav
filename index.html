<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>カーロケ風 GPSナビ DEMO</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#111a2b;color:white;font-family:'MS Gothic',sans-serif}header{display:flex;justify-content:space-between;align-items:center;background:#15294d;padding:8px 12px;font-size:13px}#map{height:calc(100dvh - 144px);min-height:230px;background:#b8c7d9}.panel{background:#2854ac;border:4px solid #a9c7f6;padding:8px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button,.menu button{background:#f0f4f7;color:#263a5a;border:2px solid #b2c6d9;padding:9px;cursor:pointer;font-size:16px}.toolbar button{flex:1;min-width:75px}.menu{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:8px}.menu.open{display:grid}.column{background:#234699;padding:4px;display:flex;flex-direction:column;gap:8px;min-height:220px}.menu button{font-size:clamp(10px,2.5vw,17px);padding:10px 2px;min-height:42px}.menu button.active{background:#ffdf85;color:#182849}.readout{display:flex;gap:15px;align-items:center;flex-wrap:wrap;padding:7px 12px;background:#172d52;font-size:13px}#status{color:#ffdf85;font-weight:bold}#notice{font-size:12px;color:#d6e5ff}.leaflet-container{font-family:sans-serif}.marker{background:#163b99;border:3px solid white;border-radius:50%;width:19px;height:19px;box-shadow:0 0 0 4px #225ad766}input{padding:8px;min-width:0;flex:3}#routeBar{display:none;gap:6px;padding:6px;background:#254a89}#routeBar.open{display:flex}#routeBar button{padding:8px}small{font-size:11px;color:#cbd8ef}@media(max-width:600px){#map{height:calc(100dvh - 154px)}.toolbar button{font-size:13px;padding:8px 4px}.readout{gap:8px}}
html,body{width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column}header,.readout,.panel{flex-shrink:0}#map{height:auto;min-height:0;flex:1}.panel{position:relative}.menu.open{position:absolute;bottom:100%;left:0;right:0;z-index:1000;background:#2854ac;border:4px solid #a9c7f6;padding:8px;margin:0;max-height:calc(100dvh - 125px);overflow:auto}.column{min-height:190px}.readout{min-height:34px}#gpsStart{background:#ffdf85;color:#162a4c;font-weight:bold}#gpsState{font-weight:bold;color:#b8d7ff}#notice{max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (orientation:landscape){header{padding:3px 10px}.readout{padding:3px 10px;gap:12px;font-size:12px}.panel{padding:5px;border-width:3px}.toolbar button{padding:5px 7px;font-size:13px;min-width:65px}.menu.open{max-height:calc(100dvh - 95px)}.column{min-height:175px;gap:5px}.menu button{min-height:33px;padding:4px 1px}.toolbar{flex-wrap:nowrap}#routeBar{padding:3px}#notice{max-width:36vw}}
@media (orientation:portrait){.menu.open{max-height:65dvh}.column{min-height:190px}.toolbar button{font-size:12px}}
</style></head><body><header><strong>CAR LOCATION SYSTEM <small>民間用・模擬表示</small></strong><span id="clock"></span></header><div class="readout"><span>自車活動：<span id="status">警ら</span></span><span>速度：<b id="speed">--</b> km/h</span><span>方位：<b id="heading">--</b>°</span><span id="gpsState">GPS：未開始</span><span id="notice">GPS開始を押してください</span></div><div id="map"></div><div class="panel"><div id="routeBar"><input id="destination" placeholder="目的地（地名・住所）"><button id="search">検索</button><button id="clear">解除</button></div><div id="menu" class="menu"></div><div class="toolbar"><button id="gpsStart">GPS開始</button><button id="current">現在地</button><button id="nav">目的地</button><button id="activity">活動状態</button><button id="follow">追従：ON</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=id=>document.getElementById(id);const cols=[['警ら','事件処理','届出急訴','駐留警戒'],['待機','休憩','休車'],['交通','警戒勤務','捜査','その他'],['検問','遊動','特命'],['１１０']];let state='警ら',pos=null,marker=null,accuracy=null,route=null,destination=null,following=true;let map=null;let mapError='';try{if(typeof L==='undefined')throw Error('地図ライブラリの読み込みに失敗');map=L.map('map',{zoomControl:true}).setView([36.5613,136.6562],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}catch(e){mapError=e.message;$('map').textContent='地図を読み込めません：'+e.message+'。ネット接続を確認してください';$('map').style.padding='20px'}function notice(s){$('notice').textContent=s}function updateState(s){state=s;$('status').textContent=s;document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.textContent===s));notice('活動状態を「'+s+'」に変更（画面内のみ）');localStorage.setItem('activity',s)}cols.forEach(col=>{let div=document.createElement('div');div.className='column';col.forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>updateState(s);div.appendChild(b)});$('menu').appendChild(div)});updateState(localStorage.getItem('activity')||'警ら');$('activity').onclick=()=>{$('menu').classList.toggle('open');setTimeout(()=>map?.invalidateSize(),100)};$('nav').onclick=()=>{$('routeBar').classList.toggle('open');setTimeout(()=>map?.invalidateSize(),100)};$('current').onclick=()=>{if(!pos){startGPS();return}if(pos&&map)map.setView(pos,Math.max(map.getZoom(),16));else notice('現在地を取得中です。位置情報を許可してください')};$('follow').onclick=()=>{following=!following;$('follow').textContent='追従：'+(following?'ON':'OFF')};window.addEventListener('resize',()=>setTimeout(()=>map?.invalidateSize(),100));screen.orientation?.addEventListener?.('change',()=>setTimeout(()=>map?.invalidateSize(),250));map?.on('dragstart',()=>{following=false;$('follow').textContent='追従：OFF'});function gps(p){$('gpsState').textContent='GPS：測位成功';$('gpsStart').textContent='GPS再取得';pos=[p.coords.latitude,p.coords.longitude];$('speed').textContent=p.coords.speed==null?'--':(p.coords.speed*3.6).toFixed(0);$('heading').textContent=p.coords.heading==null?'--':Math.round(p.coords.heading);notice('測位成功：緯度'+pos[0].toFixed(5)+' 経度'+pos[1].toFixed(5)+' ±'+Math.round(p.coords.accuracy)+'m'+(mapError?'／地図エラー：'+mapError:''));if(!map)return;try{if(!marker){marker=L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="marker"></div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);map.setView(pos,16)}else marker.setLatLng(pos);if(accuracy)map.removeLayer(accuracy);accuracy=L.circle(pos,{radius:p.coords.accuracy,color:'#3176d6',weight:1,fillOpacity:.08}).addTo(map);if(following)map.panTo(pos)}catch(e){notice('GPS取得済み／地図描画エラー：'+e.message)}}let watchId=null;function startGPS(){ $('gpsState').textContent='GPS：ボタン反応あり';notice('GPS開始ボタンが押されました');if(!window.isSecureContext){$('gpsState').textContent='GPS：利用不可';notice('HTTPSで開いてください');return}if(!navigator.geolocation){$('gpsState').textContent='GPS：非対応';notice('ブラウザが位置情報に非対応です');return}try{if(watchId!==null)navigator.geolocation.clearWatch(watchId);$('gpsState').textContent='GPS：取得中';notice('位置情報を要求しています。権限ダイアログを確認してください');watchId=navigator.geolocation.watchPosition(gps,e=>{$('gpsState').textContent='GPS：エラー '+e.code;notice(e.code===1?'位置情報が拒否されました。Chromeのサイト設定を確認':e.code===2?'位置を取得できません。端末の位置情報設定を確認':'測位タイムアウト。屋外で再試行')},{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}catch(e){$('gpsState').textContent='GPS：起動失敗';notice('GPS起動エラー：'+e.message)}}$('gpsStart').onclick=startGPS;notice('GPS開始を押してください（自動測位はしません）');let destMarker=null;async function drawRoute(){if(!map){notice('地図を読み込めないため経路表示不可');return}if(!pos||!destination){notice('GPS現在地を取得してから経路検索してください');return}notice('経路を検索中…');try{const u=`https://router.project-osrm.org/route/v1/driving/${pos[1]},${pos[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;const j=await(await fetch(u)).json();if(!j.routes?.length)throw Error('経路がありません');if(route)map.removeLayer(route);route=L.geoJSON(j.routes[0].geometry,{style:{color:'#ffae00',weight:6}}).addTo(map);map.fitBounds(route.getBounds(),{padding:[30,30]});notice('経路 '+(j.routes[0].distance/1000).toFixed(1)+'km / 推定'+Math.round(j.routes[0].duration/60)+'分（参考）')}catch(e){notice('経路検索に失敗：'+e.message)}}$('search').onclick=async()=>{let q=$('destination').value.trim();if(!q)return;notice('目的地を検索中…');try{let res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));let j=await res.json();if(!j.length)throw Error('目的地が見つかりません');destination=[+j[0].lat,+j[0].lon];if(destMarker&&map)map.removeLayer(destMarker);if(!map)throw Error('地図を読み込めません');destMarker=L.marker(destination).addTo(map).bindPopup(j[0].display_name);await drawRoute()}catch(e){notice('検索失敗：'+e.message)}};$('clear').onclick=()=>{if(route&&map)map.removeLayer(route);if(destMarker&&map)map.removeLayer(destMarker);route=destMarker=destination=null;notice('経路を解除しました')};setInterval(()=>$('clock').textContent=new Date().toLocaleString('ja-JP'),1000);$('clock').textContent=new Date().toLocaleString('ja-JP');</script></body></html>
